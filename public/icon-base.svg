    <rect x="50" y="100" width="120" height="200" rx="8" fill="white" opacity="0.9"/>
    <rect x="200" y="140" width="100" height="160" rx="8" fill="white" opacity="0.8"/>
    <rect x="320" y="180" width="80" height="120" rx="8" fill="white" opacity="0.7"/>
    
    <!-- Windows -->
    <rect x="70" y="120" width="20" height="20" rx="2" fill="#2563eb"/>
    <rect x="110" y="120" width="20" height="20" rx="2" fill="#2563eb"/>
    <rect x="130" y="120" width="20" height="20" rx="2" fill="#2563eb"/>
    
    <rect x="70" y="160" width="20" height="20" rx="2" fill="#2563eb"/>
    <rect x="110" y="160" width="20" height="20" rx="2" fill="#2563eb"/>
    <rect x="130" y="160" width="20" height="20" rx="2" fill="#2563eb"/>
    
    <rect x="220" y="160" width="15" height="15" rx="2" fill="#2563eb"/>
